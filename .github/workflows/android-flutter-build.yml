name: Android Flutter Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
    build-android:
    needs: build-android-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0
      OPERIT_ANDROID_V8_JOBS: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android terminal runtime
        uses: actions/download-artifact@v4
        with:
          name: operit2-android-runtime-${{ github.sha }}
          path: apps/flutter/app/android/app/src/main

      - name: Install LLVM 21 and Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build wget lsb-release gnupg software-properties-common
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21 all
          sudo apt-get install -y llvm-21-dev libclang-21-dev lld-21 clang-21

          for dir in /usr/lib/llvm-21/lib /usr/lib/x86_64-linux-gnu /usr/lib; do
            if [ -f "$dir/libclang.so" ] || [ -f "$dir/libclang.so.1" ]; then
              target="$dir/libclang.so"
              [ -f "$target" ] || target="$dir/libclang.so.1"
              sudo ln -sf "$target" "$dir/libclang.so.21"
            fi
          done

          sudo update-alternatives --install /usr/bin/lld lld /usr/bin/lld-21 100 || true

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python venv and Plugin Dependencies
        run: |
          python3 -m venv .venv
          npm install -g typescript
          npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3
          corepack enable
          corepack prepare pnpm@10.7.0 --activate
          cd plugins/packages/buildin/workflow
          pnpm install --frozen-lockfile
          cd ../../../..

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install FVM
        run: |
          dart pub global activate fvm $FVM_VERSION
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        run: fvm install --skip-pub-get

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-linux-android

      # Restore V8 cache if it was already built in a previous run
      - name: Restore source-built Android V8 cache
        id: v8-cache
        uses: actions/cache/restore@v4
        with:
          path: tools/release/work/android-v8
          key: ${{ runner.os }}-${{ runner.arch }}-android-v8-${{ hashFiles('tools/build_scripts/prepare_android_v8.py', 'apps/flutter/native/operit-flutter-bridge/Cargo.lock') }}

      # Pre-build V8 if cache missed
      - name: Build Android V8 (standalone)
        if: steps.v8-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p tools/release/work/android-v8
          python3 tools/build_scripts/prepare_android_v8.py \
            --target aarch64-linux-android \
            --env-file tools/release/work/android-v8/aarch64-linux-android.env

      # Save the V8 cache immediately once compiled
      - name: Save Android V8 cache
        if: steps.v8-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tools/release/work/android-v8
          key: ${{ runner.os }}-${{ runner.arch }}-android-v8-${{ hashFiles('tools/build_scripts/prepare_android_v8.py', 'apps/flutter/native/operit-flutter-bridge/Cargo.lock') }}

      - name: Generate dummy Android keystore for unsigned build
        run: |
          mkdir -p tools/release/secrets
          keytool -genkeypair -v -keystore tools/release/secrets/operit2-release.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          localProp="apps/flutter/app/android/local.properties"
          keystorePath="$(pwd)/tools/release/secrets/operit2-release.keystore"
          echo -e "\nRELEASE_STORE_FILE=$keystorePath" >> "$localProp"
          echo "RELEASE_STORE_PASSWORD=android" >> "$localProp"
          echo "RELEASE_KEY_ALIAS=androiddebugkey" >> "$localProp"
          echo "RELEASE_KEY_PASSWORD=android" >> "$localProp"

      - name: Build and package Android app
        run: |
          raw_version=$(grep -oP '^version:\s*\K[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+' apps/flutter/app/pubspec.yaml)
          build_name=$(echo "$raw_version" | cut -d'+' -f1)
          build_number=$(echo "$raw_version" | cut -d'+' -f2)
          python3 tools/build_scripts/build_flutter_android.py --build-name "$build_name" --build-number "$build_number" --enforce-lockfile --skip-signing

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-${{ github.sha }}
          path: tools/release/dist/operit2-app-android-arm64-v8a-*.apk
          if-no-files-found: error
          retention-days: 14
